name: Deploy patched face-to-many to Replicate

on:
  workflow_dispatch:
    inputs:
      model_name:
        required: true
        default: "haris3545/face-to-many-patched"
        description: "Destination Replicate model, e.g. username/modelname. Must already exist on Replicate (create it at replicate.com/create first)."

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Confirm runner architecture
        run: uname -m

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -a -f
          df -h

      - name: Setup Cog
        uses: replicate/setup-cog@v2
        with:
          token: ${{ secrets.REPLICATE_CLI_AUTH_TOKEN }}

      - name: Enable Docker's containerd image store
        # The default "docker" buildx driver was causing "unknown blob" on
        # push (5/5 consistent failures -- a real bug, not a race).
        # Switching to the docker-container driver fixed that but broke a
        # different step: cog's post-push "add labels" step expects the
        # built image to be in the local Docker image store, which the
        # docker-container driver doesn't populate. Enabling the containerd
        # snapshotter is Docker's own recommended fix for this class of
        # buildx/registry push issue, and keeps images available locally
        # too (with the default "docker" driver), so it shouldn't break
        # the labeling step the way switching drivers did.
        run: |
          echo '{"features": {"containerd-snapshotter": true}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info | grep -i "driver"

      - name: Fetch ComfyUI at pinned commit
        working-directory: vendor/cog-face-to-many
        run: |
          git clone https://github.com/comfyanonymous/ComfyUI.git ComfyUI
          cd ComfyUI && git checkout 37a86e4618098ef1e0d692d0953f072388cbc673

      - name: Install ComfyUI custom node plugins
        working-directory: vendor/cog-face-to-many
        run: ./scripts/clone_plugins.sh

      - name: Push to Replicate
        working-directory: vendor/cog-face-to-many
        env:
          # The containerd-snapshotter change fixed "unknown blob" but the
          # image that got built/pushed ended up as the wrong CPU
          # architecture ("exec /sbin/tini: exec format error" when Docker
          # tried to run it) -- force amd64 explicitly rather than rely on
          # auto-detection, which is apparently not reliable with the
          # snapshotter enabled.
          DOCKER_DEFAULT_PLATFORM: linux/amd64
        # cog push has been hitting "unknown blob" -- a Docker registry race
        # condition on layer uploads that a concurrency-limit config change
        # didn't fix, so retry a few times; these races often clear up on
        # their own rather than needing a specific config fix.
        run: |
          for attempt in 1 2 3 4 5; do
            echo "=== cog push attempt $attempt/5 ==="
            if cog push r8.im/${{ inputs.model_name }}; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 15s..."
            sleep 15
          done
          echo "All 5 push attempts failed"
          exit 1
